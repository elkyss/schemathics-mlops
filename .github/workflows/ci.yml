name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install (locked, CPU-only torch)
        run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Tests (no real data, no TabPFN API credits)
        run: pytest -q -m "not data and not api"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
      - name: Image builds
        run: docker build -f docker/Dockerfile -t bl-ranking:ci .
